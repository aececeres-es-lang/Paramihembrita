<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Ti 🌹</title>
  <!-- Tipografía elegante desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #120015, #030005);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #heartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      width: 90%;
      max-width: 420px;
      pointer-events: none;
    }

    /* Estado 1: Texto sobre el corazón 3D */
    .step-initial {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      width: 90%;
      max-width: 350px;
      text-align: center;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .instruction {
      font-size: 1rem;
      font-weight: 300;
      color: #ffd6e0;
      letter-spacing: 1px;
      background: rgba(18, 0, 21, 0.65);
      padding: 12px 26px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 183, 197, 0.25);
      box-shadow: 0 0 25px rgba(255, 46, 99, 0.15);
      animation: pulseText 2.5s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.75; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    /* Estado 2: Tarjeta Elegante */
    .step-revealed {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-revealed.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .elegant-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 28px;
      padding: 45px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                  inset 0 0 20px rgba(255, 215, 0, 0.05);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .elegant-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,183,197,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Ilustración de Rosa Elegante */
    .flower-icon {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.5));
      animation: floatFlower 4s ease-in-out infinite;
    }

    @keyframes floatFlower {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
      margin: 25px 0 22px 0;
    }

    .card-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: #fff0f3;
      line-height: 1.7;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .tap-hint {
      margin-top: 32px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Canvas Corazón 3D -->
  <canvas id="heartCanvas"></canvas>

  <!-- Canvas Destellos y Pétalos -->
  <canvas id="bgCanvas"></canvas>

  <!-- Texto inicial -->
  <div class="step-initial" id="stepInitial">
    <p class="instruction">Toca el corazón para abrir tu detalle 🌹</p>
  </div>

  <div class="container" id="interactiveZone">
    <!-- Estado Revelado Elegante -->
    <div class="step-revealed" id="stepRevealed">
      <div class="elegant-card">
        
        <!-- Ilustración Vectorial de Rosa Elegante -->
        <svg class="flower-icon" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff2e63"/>
              <stop offset="50%" stop-color="#ff4d6d"/>
              <stop offset="100%" stop-color="#800f2f"/>
            </linearGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffe5ec"/>
              <stop offset="100%" stop-color="#d4af37"/>
            </linearGradient>
          </defs>
          
          <path d="M50 55 Q50 85 48 95" stroke="#52b788" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M50 70 Q35 65 30 72 Q42 78 50 70" fill="#40916c"/>
          <path d="M50 78 Q65 73 70 80 Q58 86 50 78" fill="#40916c"/>

          <path d="M50 20 C25 10 15 35 25 55 C35 70 65 70 75 55 C85 35 75 10 50 20 Z" fill="url(#roseGrad)" opacity="0.95"/>
          <path d="M50 25 C32 18 25 38 32 50 C40 60 60 60 68 50 C75 38 68 18 50 25 Z" fill="#ff4d6d"/>
          <path d="M50 30 C38 25 34 40 40 46 C45 52 55 52 60 46 C66 40 62 25 50 30 Z" fill="url(#goldGrad)"/>
          <path d="M50 34 C44 32 42 40 46 43 C48 45 52 45 54 43 C58 40 56 32 50 34 Z" fill="#ffccd5"/>
        </svg>

        <div class="divider"></div>
        
        <p class="card-text">
          Quizás no son flores de jardín, pero estas fueron programadas y creadas pensando únicamente en ti.
        </p>

        <p class="tap-hint">Toca la pantalla para soltar destellos</p>
      </div>
    </div>
  </div>

  <script>
    /* --- CORAZÓN 3D DE PARTÍCULAS --- */
    const hCanvas = document.getElementById('heartCanvas');
    const hCtx = hCanvas.getContext('2d');

    let width, height;
    function resizeHeartCanvas() {
      width = hCanvas.width = window.innerWidth;
      height = hCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeHeartCanvas);
    resizeHeartCanvas();

    const NUM_POINTS = 3200;
    const points = [];

    for (let i = 0; i < NUM_POINTS; i++) {
      const u = Math.random() * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(u), 3);
      const hy = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
      
      const r = Math.random();
      const rad = Math.sqrt(r);
      const x = hx * rad;
      const y = hy * rad;
      const z = (1 - rad) * (Math.random() * 12 - 6);

      points.push({ x, y, z });
    }

    let theta = 0;
    let isHeartActive = true;

    function render3DHeart() {
      if (!isHeartActive) return;

      hCtx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2 - 20;
      
      const baseScale = Math.min(width, height) / 38;
      const heartbeat = 1 + 0.06 * Math.sin(Date.now() * 0.004);
      const scale = baseScale * heartbeat;

      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);

      const projected = [];
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const xr = p.x * cosT + p.z * sinT;
        const zr = -p.x * sinT + p.z * cosT;
        const yr = p.y;

        projected.push({
          x: cx + xr * scale,
          y: cy - yr * scale,
          zr: zr,
          depth: (zr + 12) / 24
        });
      }

      projected.sort((a, b) => a.zr - b.zr);

      for (let i = 0; i < projected.length; i++) {
        const p = projected[i];
        const depth = Math.max(0, Math.min(1, p.depth));
        
        const rVal = 255;
        const gVal = Math.floor(25 + depth * 75);
        const bVal = Math.floor(70 + depth * 110);
        
        const size = (1.5 + depth * 2.2) * (scale / 12);

        hCtx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
        hCtx.beginPath();
        hCtx.arc(p.x, p.y, size, 0, Math.PI * 2);
        hCtx.fill();
      }

      theta += 0.022;
      requestAnimationFrame(render3DHeart);
    }
    render3DHeart();

    /* --- CANVAS DE DESTELLOS Y PÉTALOS (FONDO) --- */
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    function resizeBgCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBgCanvas);
    resizeBgCanvas();

    const particles = [];
    let isRevealed = false;

    class Particle {
      constructor(x, y, type) {
        this.x = x || Math.random() * width;
        this.y = y || (type === 'petal' ? -20 : Math.random() * height);
        this.type = type;
        this.size = type === 'petal' ? Math.random() * 7 + 5 : Math.random() * 3 + 1.5;
        this.speedX = Math.random() * 1.5 - 0.75;
        this.speedY = type === 'petal' ? Math.random() * 1.2 + 0.8 : -(Math.random() * 1.5 + 0.3);
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.life = 100;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        if (this.type === 'sparkle') {
          this.life -= 1.2;
          this.opacity = this.life / 100;
        }

        if (this.type === 'petal' && this.y > height + 20) {
          this.y = -20;
          this.x = Math.random() * width;
        }
      }

      draw() {
        bgCtx.save();
        bgCtx.translate(this.x, this.y);
        bgCtx.rotate((this.rotation * Math.PI) / 180);
        bgCtx.globalAlpha = Math.max(0, this.opacity);

        if (this.type === 'petal') {
          bgCtx.fillStyle = '#ff4d6d';
          bgCtx.beginPath();
          bgCtx.moveTo(0, 0);
          bgCtx.quadraticCurveTo(this.size, -this.size, this.size * 1.5, 0);
          bgCtx.quadraticCurveTo(this.size, this.size, 0, 0);
          bgCtx.fill();
        } else if (this.type === 'sparkle') {
          bgCtx.fillStyle = '#ffe5ec';
          bgCtx.shadowColor = '#ffd700';
          bgCtx.shadowBlur = 10;
          bgCtx.beginPath();
          bgCtx.arc(0, 0, this.size, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.restore();
      }
    }

    for (let i = 0; i < 22; i++) {
      particles.push(new Particle(null, null, 'petal'));
    }

    function animateParticles() {
      bgCtx.clearRect(0, 0, width, height);
      particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.type === 'sparkle' && p.life <= 0) {
          particles.splice(index, 1);
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* --- TRANSICIÓN AL TOCAR LA PANTALLA --- */
    const stepInitial = document.getElementById('stepInitial');
    const stepRevealed = document.getElementById('stepRevealed');

    function handleTap(e) {
      const x = e.clientX || (e.touches && e.touches[0].clientX) || width / 2;
      const y = e.clientY || (e.touches && e.touches[0].clientY) || height / 2;

      if (!isRevealed) {
        isRevealed = true;
        
        hCanvas.style.opacity = '0';
        hCanvas.style.transform = 'scale(1.25)';
        stepInitial.style.opacity = '0';

        setTimeout(() => {
          hCanvas.classList.add('hidden');
          stepInitial.classList.add('hidden');
          stepRevealed.classList.add('active');
          isHeartActive = false;
        }, 700);

        for (let i = 0; i < 35; i++) {
          particles.push(new Particle(x + (Math.random() * 60 - 30), y + (Math.random() * 60 - 30), 'sparkle'));
        }
      } else {
        for (let i = 0; i < 8; i++) {
          particles.push(new Particle(x + (Math.random() * 40 - 20), y + (Math.random() * 40 - 20), 'sparkle'));
        }
      }
    }

    document.addEventListener('click', handleTap);
    document.addEventListener('touchstart', (e) => {
      handleTap(e);
    }, { passive: true });
  </script>
</body>
  </html>
