<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tus Flores Favoritas 🌹</title>
  <!-- Carga de Three.js para renderizado 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #1b021a, #050008);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      transition: opacity 1s ease, transform 1s ease;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      pointer-events: none;
    }

    /* Estado 1: Inicial (Texto sobre la rosa 3D) */
    .step-initial {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 70vh;
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: auto;
      cursor: pointer;
    }

    .instruction {
      font-size: 1.2rem;
      color: #ffb3c1;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 179, 193, 0.2);
      animation: fadeInOut 2s infinite ease-in-out;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.6; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-5px); }
    }

    /* Estado 2: Revelado */
    .step-revealed {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-revealed.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .caiman-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .caiman-svg {
      width: 180px;
      height: 180px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-top: 15px;
      background: linear-gradient(45deg, #4ef0a3, #2cd8d5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .sub-title {
      font-size: 1.25rem;
      color: #ffe5ec;
      margin-top: 10px;
      font-weight: 500;
      line-height: 1.4;
    }

    .tap-hint {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #a0a0a0;
      font-style: italic;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Canvas 3D para la Rosa -->
  <div id="canvas3d"></div>

  <!-- Canvas 2D para Partículas -->
  <canvas id="canvas"></canvas>

  <div class="container" id="interactiveZone">
    <!-- Estado Inicial -->
    <div class="step-initial" id="stepInitial">
      <p class="instruction">Toca la rosa para ver tus flores favoritas 🌹</p>
    </div>

    <!-- Estado Revelado (Caimán) -->
    <div class="step-revealed" id="stepRevealed">
      <div class="caiman-card">
        <svg class="caiman-svg" viewBox="0 0 200 200">
          <path d="M40 150 Q100 190 160 150 Q180 120 160 100 Q100 140 40 100 Q20 120 40 150 Z" fill="#25a25a"/>
          <path d="M20 130 Q100 180 180 130 Q190 100 170 80 Q100 120 30 80 Q10 100 20 130 Z" fill="#32be6a" opacity="0.8"/>
          <ellipse cx="100" cy="140" rx="75" ry="20" fill="#48cae4" opacity="0.7"/>
          <ellipse cx="100" cy="120" rx="55" ry="35" fill="#52b788"/>
          <path d="M60 110 Q100 70 140 110 Q150 125 100 130 Q50 125 60 110 Z" fill="#74c69d"/>
          <ellipse cx="100" cy="115" rx="30" ry="12" fill="#95d5b2"/>
          <circle cx="90" cy="112" r="2" fill="#2d6a4f"/>
          <circle cx="110" cy="112" r="2" fill="#2d6a4f"/>
          <circle cx="80" cy="90" r="14" fill="#ffffff"/>
          <circle cx="120" cy="90" r="14" fill="#ffffff"/>
          <circle cx="82" cy="90" r="8" fill="#1b4332"/>
          <circle cx="118" cy="90" r="8" fill="#1b4332"/>
          <circle cx="85" cy="87" r="3" fill="#ffffff"/>
          <circle cx="121" cy="87" r="3" fill="#ffffff"/>
          <ellipse cx="70" cy="102" rx="6" ry="4" fill="#ffb3c1" opacity="0.6"/>
          <ellipse cx="130" cy="102" rx="6" ry="4" fill="#ffb3c1" opacity="0.6"/>
          <g transform="translate(115, 65) scale(0.4)">
            <path fill="#ff2e63" d="M50 15 C35 5, 20 20, 25 35 C10 45, 15 65, 30 70 C40 85, 60 85, 70 70 C85 65, 90 45, 75 35 C80 20, 65 5, 50 15 Z"/>
            <path fill="#ff6b81" d="M50 25 C40 18, 30 28, 35 38 C25 45, 30 58, 40 60 C50 70, 60 65, 65 58 C73 52, 72 40, 65 38 C70 28, 60 18, 50 25 Z"/>
          </g>
        </svg>

        <h1 class="main-title">¡Glugluglu! 🐊</h1>
        <p class="sub-title">¡Para la más linda!<br>Te amo ❤️</p>
        <p class="tap-hint">(Toca la pantalla para hacer burbujas)</p>
      </div>
    </div>
  </div>

  <script>
    /* --- CONFIGURACIÓN DE LA ROSA 3D CON THREE.JS --- */
    const container3d = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container3d.appendChild(renderer.domElement);

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffb3c1, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xff2e63, 2.5, 20);
    pointLight.position.set(0, 1, 3);
    scene.add(pointLight);

    // Grupo de la Rosa
    const roseGroup = new THREE.Group();

    // Tallo
    const stemGeo = new THREE.CylinderGeometry(0.06, 0.08, 3.5, 16);
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.6 });
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.y = -1.6;
    roseGroup.add(stem);

    // Hojas
    function createLeaf(x, y, z, rotX, rotY, rotZ) {
      const leafGeo = new THREE.PlaneGeometry(0.7, 1.2, 8, 8);
      const pos = leafGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let py = pos.getY(i);
        pos.setZ(i, -Math.sin(py + 0.6) * 0.15);
      }
      leafGeo.computeVertexNormals();
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x40916c, side: THREE.DoubleSide, roughness: 0.5 });
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(x, y, z);
      leaf.rotation.set(rotX, rotY, rotZ);
      return leaf;
    }
    roseGroup.add(createLeaf(0.3, -1.0, 0, 0.3, 0.5, -0.8));
    roseGroup.add(createLeaf(-0.3, -1.8, 0, -0.3, -2.0, 0.8));

    // Generador de Pétalos 3D
    function createPetalGeometry(width, height, curve) {
      const geo = new THREE.PlaneGeometry(width, height, 12, 12);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        let x = p.getX(i);
        let y = p.getY(i);
        let z = -Math.pow(x / (width/2), 2) * curve + (y / height) * 0.1;
        p.setZ(i, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const petalMat = new THREE.MeshStandardMaterial({
      color: 0xd90429,
      roughness: 0.35,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    // Construcción multicapa de la cabeza de la rosa
    const numPetals = 40;
    for (let i = 0; i < numPetals; i++) {
      const progress = i / numPetals;
      const size = 0.25 + progress * 0.75;
      const curve = 0.1 + progress * 0.35;
      
      const petalGeo = createPetalGeometry(size, size * 1.3, curve);
      const petal = new THREE.Mesh(petalGeo, petalMat);

      const angle = i * 137.5 * (Math.PI / 180); // Ángulo Dorado
      const radius = Math.pow(progress, 0.75) * 0.55;
      
      petal.position.x = Math.cos(angle) * radius;
      petal.position.z = Math.sin(angle) * radius;
      petal.position.y = progress * 0.35;

      const tilt = Math.PI * 0.08 + progress * Math.PI * 0.38;
      petal.rotation.y = -angle + Math.PI / 2;
      petal.rotation.x = tilt;

      roseGroup.add(petal);
    }

    scene.add(roseGroup);
    camera.position.set(0, 0.2, 5.5);

    // Animación de rotación 3D
    let is3DActive = true;
    function animate3D() {
      if (is3DActive) {
        requestAnimationFrame(animate3D);
        roseGroup.rotation.y += 0.012; // Girar sobre su propio eje
        roseGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.08; // Suave balanceo
        renderer.render(scene, camera);
      }
    }
    animate3D();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* --- CANVAS 2D DE PARTÍCULAS (PÉTALOS Y BURBUJAS) --- */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    let isRevealed = false;

    class Particle {
      constructor(x, y, type) {
        this.x = x || Math.random() * width;
        this.y = y || (type === 'petal' ? -20 : height + 20);
        this.type = type;
        this.size = type === 'petal' ? Math.random() * 8 + 6 : Math.random() * 12 + 8;
        this.speedX = Math.random() * 2 - 1;
        this.speedY = type === 'petal' ? Math.random() * 1.5 + 1 : -(Math.random() * 2 + 1);
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.text = type === 'bubble' && Math.random() > 0.5 ? 'gluglu' : null;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        if (this.type === 'petal' && this.y > height + 20) {
          this.y = -20;
          this.x = Math.random() * width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;

        if (this.type === 'petal') {
          ctx.fillStyle = '#ff4d6d';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(this.size, -this.size, this.size * 1.5, 0);
          ctx.quadraticCurveTo(this.size, this.size, 0, 0);
          ctx.fill();
        } else if (this.type === 'bubble') {
          ctx.strokeStyle = '#4ea8de';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(78, 168, 222, 0.15)';
          ctx.fill();

          if (this.text) {
            ctx.fillStyle = '#72efdd';
            ctx.font = '10px sans-serif';
            ctx.fillText(this.text, -12, 3);
          }
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 25; i++) {
      particles.push(new Particle(null, null, 'petal'));
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.type === 'bubble' && p.y < -30) {
          particles.splice(index, 1);
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* --- INTERACCIÓN Y TRANSICIÓN --- */
    const stepInitial = document.getElementById('stepInitial');
    const stepRevealed = document.getElementById('stepRevealed');

    function handleTap(e) {
      const x = e.clientX || (e.touches && e.touches[0].clientX) || width / 2;
      const y = e.clientY || (e.touches && e.touches[0].clientY) || height / 2;

      if (!isRevealed) {
        isRevealed = true;
        
        // Transición de la rosa 3D
        container3d.style.opacity = '0';
        container3d.style.transform = 'scale(1.2)';
        stepInitial.style.opacity = '0';

        setTimeout(() => {
          container3d.classList.add('hidden');
          stepInitial.classList.add('hidden');
          stepRevealed.classList.add('active');
          is3DActive = false; // Detener bucle 3D para ahorrar recursos
        }, 800);

        for (let i = 0; i < 25; i++) {
          particles.push(new Particle(x, y, 'bubble'));
        }
      } else {
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(x + (Math.random() * 40 - 20), y + (Math.random() * 40 - 20), 'bubble'));
        }
      }
    }

    document.addEventListener('click', handleTap);
    document.addEventListener('touchstart', (e) => {
      handleTap(e);
    }, { passive: true });
  </script>
</body>
  </html>
