<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tus Flores Favoritas 🌹</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #030005;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #heartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer;
    }

    #bubbleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      pointer-events: none;
    }

    /* Estado 1: Texto sobre el corazón 3D */
    .step-initial {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      width: 90%;
      max-width: 350px;
      text-align: center;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .instruction {
      font-size: 1.1rem;
      color: #ff99ac;
      letter-spacing: 0.5px;
      background: rgba(15, 2, 10, 0.65);
      padding: 12px 24px;
      border-radius: 25px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 77, 109, 0.3);
      box-shadow: 0 0 20px rgba(255, 46, 99, 0.2);
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    /* Estado 2: Revelado (Caimán) */
    .step-revealed {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-revealed.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .caiman-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .caiman-svg {
      width: 180px;
      height: 180px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-top: 15px;
      background: linear-gradient(45deg, #4ef0a3, #2cd8d5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .sub-title {
      font-size: 1.25rem;
      color: #ffe5ec;
      margin-top: 10px;
      font-weight: 500;
      line-height: 1.4;
    }

    .tap-hint {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #a0a0a0;
      font-style: italic;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Canvas para el Corazón 3D de Partículas -->
  <canvas id="heartCanvas"></canvas>

  <!-- Canvas 2D para Partículas de fondo (pétalos / burbujas) -->
  <canvas id="bubbleCanvas"></canvas>

  <!-- Texto flotante inicial -->
  <div class="step-initial" id="stepInitial">
    <p class="instruction">Toca el corazón para ver tus flores favoritas 🌹</p>
  </div>

  <div class="container" id="interactiveZone">
    <!-- Estado Revelado (Caimán) -->
    <div class="step-revealed" id="stepRevealed">
      <div class="caiman-card">
        <svg class="caiman-svg" viewBox="0 0 200 200">
          <path d="M40 150 Q100 190 160 150 Q180 120 160 100 Q100 140 40 100 Q20 120 40 150 Z" fill="#25a25a"/>
          <path d="M20 130 Q100 180 180 130 Q190 100 170 80 Q100 120 30 80 Q10 100 20 130 Z" fill="#32be6a" opacity="0.8"/>
          <ellipse cx="100" cy="140" rx="75" ry="20" fill="#48cae4" opacity="0.7"/>
          <ellipse cx="100" cy="120" rx="55" ry="35" fill="#52b788"/>
          <path d="M60 110 Q100 70 140 110 Q150 125 100 130 Q50 125 60 110 Z" fill="#74c69d"/>
          <ellipse cx="100" cy="115" rx="30" ry="12" fill="#95d5b2"/>
          <circle cx="90" cy="112" r="2" fill="#2d6a4f"/>
          <circle cx="110" cy="112" r="2" fill="#2d6a4f"/>
          <circle cx="80" cy="90" r="14" fill="#ffffff"/>
          <circle cx="120" cy="90" r="14" fill="#ffffff"/>
          <circle cx="82" cy="90" r="8" fill="#1b4332"/>
          <circle cx="118" cy="90" r="8" fill="#1b4332"/>
          <circle cx="85" cy="87" r="3" fill="#ffffff"/>
          <circle cx="121" cy="87" r="3" fill="#ffffff"/>
          <ellipse cx="70" cy="102" rx="6" ry="4" fill="#ffb3c1" opacity="0.6"/>
          <ellipse cx="130" cy="102" rx="6" ry="4" fill="#ffb3c1" opacity="0.6"/>
          <g transform="translate(115, 65) scale(0.4)">
            <path fill="#ff2e63" d="M50 15 C35 5, 20 20, 25 35 C10 45, 15 65, 30 70 C40 85, 60 85, 70 70 C85 65, 90 45, 75 35 C80 20, 65 5, 50 15 Z"/>
            <path fill="#ff6b81" d="M50 25 C40 18, 30 28, 35 38 C25 45, 30 58, 40 60 C50 70, 60 65, 65 58 C73 52, 72 40, 65 38 C70 28, 60 18, 50 25 Z"/>
          </g>
        </svg>

        <h1 class="main-title">¡Glugluglu! 🐊</h1>
        <p class="sub-title">¡Para la más linda!<br>Te amo ❤️</p>
        <p class="tap-hint">(Toca la pantalla para hacer burbujas)</p>
      </div>
    </div>
  </div>

  <script>
    /* --- CORAZÓN 3D DE PARTÍCULAS (PYTHON TURTLE PARAGUAS CONVERTIDO A JS CANVAS) --- */
    const hCanvas = document.getElementById('heartCanvas');
    const hCtx = hCanvas.getContext('2d');

    let width, height;
    function resizeHeartCanvas() {
      width = hCanvas.width = window.innerWidth;
      height = hCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeHeartCanvas);
    resizeHeartCanvas();

    // Generar nube de puntos en 3D con la fórmula matemática del corazón
    const NUM_POINTS = 3200;
    const points = [];

    for (let i = 0; i < NUM_POINTS; i++) {
      const u = Math.random() * Math.PI * 2;
      
      // Ecuación paramétrica de corazón
      const hx = 16 * Math.pow(Math.sin(u), 3);
      const hy = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
      
      // Relleno de volumen interno y profundidad 3D
      const r = Math.random();
      const rad = Math.sqrt(r);
      const x = hx * rad;
      const y = hy * rad;
      const z = (1 - rad) * (Math.random() * 12 - 6);

      points.push({ x, y, z });
    }

    let theta = 0;
    let isHeartActive = true;

    function render3DHeart() {
      if (!isHeartActive) return;

      hCtx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2 - 20;
      
      // Escala adaptativa según tamaño de pantalla + Latido continuo
      const baseScale = Math.min(width, height) / 38;
      const heartbeat = 1 + 0.06 * Math.sin(Date.now() * 0.004);
      const scale = baseScale * heartbeat;

      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);

      // Proyectar puntos 3D -> 2D
      const projected = [];
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        
        // Rotación alrededor del eje Y
        const xr = p.x * cosT + p.z * sinT;
        const zr = -p.x * sinT + p.z * cosT;
        const yr = p.y;

        projected.push({
          x: cx + xr * scale,
          y: cy - yr * scale, // Invertir Y para coordenadas de pantalla
          zr: zr,
          depth: (zr + 12) / 24
        });
      }

      // Ordenar por profundidad (Painter's algorithm)
      projected.sort((a, b) => a.zr - b.zr);

      // Dibujar partículas con gradiente de color brillante
      for (let i = 0; i < projected.length; i++) {
        const p = projected[i];
        const depth = Math.max(0, Math.min(1, p.depth));
        
        // Interpolación cromática: Rojo profundo -> Rosa fosforescente
        const rVal = 255;
        const gVal = Math.floor(20 + depth * 80);
        const bVal = Math.floor(60 + depth * 120);
        
        const size = (1.5 + depth * 2.2) * (scale / 12);

        hCtx.fillStyle = `rgb(${rVal}, ${gVal}, ${bVal})`;
        hCtx.beginPath();
        hCtx.arc(p.x, p.y, size, 0, Math.PI * 2);
        hCtx.fill();
      }

      theta += 0.025; // Velocidad de rotación
      requestAnimationFrame(render3DHeart);
    }
    render3DHeart();

    /* --- CANVAS DE BURBUJAS Y PÉTALOS EN SEGUNDO PLANO --- */
    const bCanvas = document.getElementById('bubbleCanvas');
    const bCtx = bCanvas.getContext('2d');

    function resizeBubbleCanvas() {
      bCanvas.width = window.innerWidth;
      bCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBubbleCanvas);
    resizeBubbleCanvas();

    const particles = [];
    let isRevealed = false;

    class Particle {
      constructor(x, y, type) {
        this.x = x || Math.random() * width;
        this.y = y || (type === 'petal' ? -20 : height + 20);
        this.type = type;
        this.size = type === 'petal' ? Math.random() * 8 + 6 : Math.random() * 12 + 8;
        this.speedX = Math.random() * 2 - 1;
        this.speedY = type === 'petal' ? Math.random() * 1.5 + 1 : -(Math.random() * 2 + 1);
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.text = type === 'bubble' && Math.random() > 0.5 ? 'gluglu' : null;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        if (this.type === 'petal' && this.y > height + 20) {
          this.y = -20;
          this.x = Math.random() * width;
        }
      }

      draw() {
        bCtx.save();
        bCtx.translate(this.x, this.y);
        bCtx.rotate((this.rotation * Math.PI) / 180);
        bCtx.globalAlpha = this.opacity;

        if (this.type === 'petal') {
          bCtx.fillStyle = '#ff4d6d';
          bCtx.beginPath();
          bCtx.moveTo(0, 0);
          bCtx.quadraticCurveTo(this.size, -this.size, this.size * 1.5, 0);
          bCtx.quadraticCurveTo(this.size, this.size, 0, 0);
          bCtx.fill();
        } else if (this.type === 'bubble') {
          bCtx.strokeStyle = '#4ea8de';
          bCtx.lineWidth = 1.5;
          bCtx.beginPath();
          bCtx.arc(0, 0, this.size, 0, Math.PI * 2);
          bCtx.stroke();
          bCtx.fillStyle = 'rgba(78, 168, 222, 0.15)';
          bCtx.fill();

          if (this.text) {
            bCtx.fillStyle = '#72efdd';
            bCtx.font = '10px sans-serif';
            bCtx.fillText(this.text, -12, 3);
          }
        }
        bCtx.restore();
      }
    }

    for (let i = 0; i < 20; i++) {
      particles.push(new Particle(null, null, 'petal'));
    }

    function animateParticles() {
      bCtx.clearRect(0, 0, width, height);
      particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.type === 'bubble' && p.y < -30) {
          particles.splice(index, 1);
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* --- TRANSICIÓN DE PANTALLAS AL TOCAR --- */
    const stepInitial = document.getElementById('stepInitial');
    const stepRevealed = document.getElementById('stepRevealed');

    function handleTap(e) {
      const x = e.clientX || (e.touches && e.touches[0].clientX) || width / 2;
      const y = e.clientY || (e.touches && e.touches[0].clientY) || height / 2;

      if (!isRevealed) {
        isRevealed = true;
        
        // Efecto de desvanecimiento del corazón 3D
        hCanvas.style.opacity = '0';
        hCanvas.style.transform = 'scale(1.3)';
        stepInitial.style.opacity = '0';

        setTimeout(() => {
          hCanvas.classList.add('hidden');
          stepInitial.classList.add('hidden');
          stepRevealed.classList.add('active');
          isHeartActive = false; // Detener bucle para ahorrar recursos
        }, 700);

        for (let i = 0; i < 25; i++) {
          particles.push(new Particle(x, y, 'bubble'));
        }
      } else {
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(x + (Math.random() * 40 - 20), y + (Math.random() * 40 - 20), 'bubble'));
        }
      }
    }

    document.addEventListener('click', handleTap);
    document.addEventListener('touchstart', (e) => {
      handleTap(e);
    }, { passive: true });
  </script>
</body>
            </html>
